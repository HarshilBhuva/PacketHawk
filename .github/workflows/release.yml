name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Require committed lockfile
        run: |
          test -f Cargo.lock || {
            echo "::error::Cargo.lock must be committed before publishing a release."
            exit 1
          }

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings

      - name: Build reproducibly
        run: cargo build --release --locked

      - name: Smoke-test release binary
        run: |
          set -euo pipefail
          ./target/release/packethawk --version
          ./target/release/packethawk --help >/dev/null
          ./target/release/packethawk config check config/default.toml

      - name: Package and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/packethawk-${RELEASE_TAG}-linux-x86_64.tar.gz" -C target/release packethawk
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
