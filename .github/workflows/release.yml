name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Require committed lockfile
        run: |
          test -f Cargo.lock || {
            echo "::error::Cargo.lock must be committed before publishing a release."
            exit 1
          }

      - name: Audit dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

      - name: Build reproducibly
        run: cargo build --release --locked

      - name: Smoke-test release binary
        run: |
          set -euo pipefail
          ./target/release/packethawk --version
          ./target/release/packethawk --help >/dev/null
          ./target/release/packethawk config check config/default.toml

      - name: Package and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/packethawk-${RELEASE_TAG}-linux-x86_64.tar.gz" -C target/release packethawk
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "${RELEASE_TAG}" dist/* --generate-notes --verify-tag
