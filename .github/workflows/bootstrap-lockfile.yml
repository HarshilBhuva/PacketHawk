name: Bootstrap Cargo.lock

on:
  push:
    branches: [chore/generate-cargo-lock]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.ref_name == 'chore/generate-cargo-lock'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate dependency lockfile
        run: |
          set -euo pipefail
          if [ -s Cargo.lock ]; then
            echo "Cargo.lock already exists; no regeneration needed."
            exit 0
          fi
          cargo generate-lockfile
          test -s Cargo.lock

      - name: Commit lockfile to this branch
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: add Cargo.lock for reproducible dependency resolution"
          git push origin "HEAD:${GITHUB_REF_NAME}"
