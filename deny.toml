# Explicit allow-list for licenses present in the committed dependency graph.
# Review new license identifiers before adding them here.
[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense"
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
