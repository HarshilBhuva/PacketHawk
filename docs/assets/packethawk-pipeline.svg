<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">PacketHawk analysis pipeline</title><desc id="desc">Animated packet markers move across six stages: PCAP input, bounded reader, protocol decoder, flow aggregator, detection rules, and evidence report.</desc>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern><style>
:root{--bg:#f3f1e9;--panel:#faf9f4;--ink:#20211c;--muted:#626459;--line:rgba(32,33,28,.22);--grid:rgba(32,33,28,.06);--accent:#c78354}
@media(prefers-color-scheme:dark){:root{--bg:#11120f;--panel:#191a16;--ink:#f2f0e8;--muted:#a5a69b;--line:rgba(242,240,232,.22);--grid:rgba(242,240,232,.05);--accent:#e5ac82}}
text{font-family:Inter,system-ui,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.node{fill:var(--panel);stroke:var(--line)}.line{stroke:var(--line);stroke-width:2}.packet{fill:var(--accent);filter:drop-shadow(0 0 5px var(--accent));animation:travel 5s linear infinite}.packet.p2{animation-delay:-1.65s}.packet.p3{animation-delay:-3.3s}
@keyframes travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(990px);opacity:0}}
@media(prefers-reduced-motion:reduce){.packet{animation:none;opacity:.8}}
</style></defs>
<rect width="1200" height="300" rx="20" fill="var(--bg)"/><rect width="1200" height="300" rx="20" fill="url(#g)"/><rect x="1" y="1" width="1198" height="298" rx="19" fill="none" stroke="var(--line)"/>
<text x="40" y="43" font-size="13" font-weight="700" letter-spacing="2" class="muted">THE ANALYSIS PIPELINE</text>
<g transform="translate(40 88)">
<path d="M78 54H1080" class="line"/>
<g transform="translate(0 0)"><rect width="150" height="110" rx="12" class="node"/><text x="18" y="34" font-size="12" class="muted">01 / INPUT</text><text x="18" y="64" font-size="19" font-weight="700">Capture</text><text x="18" y="87" font-size="12" class="muted">PCAP · PCAPNG</text></g>
<g transform="translate(202 0)"><rect width="150" height="110" rx="12" class="node"/><text x="18" y="34" font-size="12" class="muted">02 / INGEST</text><text x="18" y="64" font-size="19" font-weight="700">Read</text><text x="18" y="87" font-size="12" class="muted">Bounded streams</text></g>
<g transform="translate(404 0)"><rect width="150" height="110" rx="12" class="node"/><text x="18" y="34" font-size="12" class="muted">03 / DECODE</text><text x="18" y="64" font-size="19" font-weight="700">Normalize</text><text x="18" y="87" font-size="12" class="muted">Protocol metadata</text></g>
<g transform="translate(606 0)"><rect width="150" height="110" rx="12" class="node"/><text x="18" y="34" font-size="12" class="muted">04 / CONTEXT</text><text x="18" y="64" font-size="19" font-weight="700">Aggregate</text><text x="18" y="87" font-size="12" class="muted">Bounded flows</text></g>
<g transform="translate(808 0)"><rect width="150" height="110" rx="12" class="node"/><text x="18" y="34" font-size="12" class="muted">05 / ANALYZE</text><text x="18" y="64" font-size="19" font-weight="700">Detect</text><text x="18" y="87" font-size="12" class="muted">Explainable rules</text></g>
<g transform="translate(1010 0)"><rect width="110" height="110" rx="12" fill="var(--accent)" fill-opacity=".2" stroke="var(--accent)"/><text x="14" y="34" font-size="12" class="muted">06 / OUTPUT</text><text x="14" y="64" font-size="18" font-weight="700">Report</text><text x="14" y="87" font-size="12" class="muted">JSON · Text</text></g>
<circle class="packet" cx="0" cy="54" r="5"/><circle class="packet p2" cx="0" cy="54" r="4"/><circle class="packet p3" cx="0" cy="54" r="3"/>
</g>
<text x="40" y="250" font-size="12" class="muted">Resource caps · malformed-safe parsing · explicit eviction counters · no active network operations</text>
</svg>