<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">PacketHawk architecture pipeline</title><desc id="desc">Offline packet capture flows through ingestion, decoding, normalization, flow analysis, detection, and evidence-backed reporting.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient><linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/></linearGradient><linearGradient id="violet" x1="0" x2="1"><stop stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient><linearGradient id="green" x1="0" x2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#a3e635"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/></filter></defs>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/><circle cx="1080" cy="40" r="180" fill="#2563eb" opacity=".10"/><circle cx="80" cy="390" r="190" fill="#06b6d4" opacity=".08"/>
<text x="54" y="58" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">PACKETHAWK / SYSTEM PIPELINE</text><text x="54" y="86" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="14">Offline-first network telemetry analysis • saved captures only</text>
<g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
<rect x="48" y="145" width="145" height="112" rx="16" fill="#172554" stroke="#38bdf8"/><text x="120" y="184" fill="#7dd3fc" font-size="13" text-anchor="middle" font-weight="700">INPUT</text><text x="120" y="211" fill="#f8fafc" font-size="18" text-anchor="middle" font-weight="700">PCAP</text><text x="120" y="234" fill="#cbd5e1" font-size="12" text-anchor="middle">/ PCAPNG</text>
<rect x="236" y="145" width="145" height="112" rx="16" fill="#102a43" stroke="#22d3ee"/><text x="308" y="184" fill="#67e8f9" font-size="13" text-anchor="middle" font-weight="700">M1</text><text x="308" y="211" fill="#f8fafc" font-size="17" text-anchor="middle" font-weight="700">Ingest</text><text x="308" y="234" fill="#cbd5e1" font-size="12" text-anchor="middle">Read + validate</text>
<rect x="424" y="145" width="145" height="112" rx="16" fill="#172554" stroke="#60a5fa"/><text x="496" y="184" fill="#93c5fd" font-size="13" text-anchor="middle" font-weight="700">M1</text><text x="496" y="211" fill="#f8fafc" font-size="17" text-anchor="middle" font-weight="700">Decode</text><text x="496" y="234" fill="#cbd5e1" font-size="12" text-anchor="middle">L2 / L3 / L4</text>
<rect x="612" y="145" width="145" height="112" rx="16" fill="#241b4b" stroke="#a78bfa"/><text x="684" y="184" fill="#c4b5fd" font-size="13" text-anchor="middle" font-weight="700">M2</text><text x="684" y="211" fill="#f8fafc" font-size="17" text-anchor="middle" font-weight="700">Normalize</text><text x="684" y="234" fill="#cbd5e1" font-size="12" text-anchor="middle">Packet models</text>
<rect x="800" y="145" width="145" height="112" rx="16" fill="#2e1b46" stroke="#c084fc"/><text x="872" y="184" fill="#e9d5ff" font-size="13" text-anchor="middle" font-weight="700">M2 / M3</text><text x="872" y="211" fill="#f8fafc" font-size="17" text-anchor="middle" font-weight="700">Analyze</text><text x="872" y="234" fill="#cbd5e1" font-size="12" text-anchor="middle">Flows + rules</text>
<rect x="988" y="145" width="164" height="112" rx="16" fill="#12352f" stroke="#34d399"/><text x="1070" y="184" fill="#6ee7b7" font-size="13" text-anchor="middle" font-weight="700">OUTPUT</text><text x="1070" y="211" fill="#f8fafc" font-size="17" text-anchor="middle" font-weight="700">Findings</text><text x="1070" y="234" fill="#cbd5e1" font-size="12" text-anchor="middle">Evidence + reports</text>
</g>
<g stroke="#64748b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M195 201h31m-8-7 8 7-8 7"/><path d="M383 201h31m-8-7 8 7-8 7"/><path d="M571 201h31m-8-7 8 7-8 7"/><path d="M759 201h31m-8-7 8 7-8 7"/><path d="M947 201h31m-8-7 8 7-8 7"/></g>
<rect x="48" y="300" width="1104" height="76" rx="14" fill="#0f1b31" stroke="#334155"/><text x="76" y="331" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">ENGINEERING GUARANTEES</text><g fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="13"><text x="76" y="355">Bounded input</text><text x="300" y="355">Malformed-safe parsing</text><text x="580" y="355">Explainable detections</text><text x="850" y="355">Offline by default</text></g><g fill="#34d399"><circle cx="62" cy="351" r="4"/><circle cx="286" cy="351" r="4"/><circle cx="566" cy="351" r="4"/><circle cx="836" cy="351" r="4"/></g>
<!-- Animated packet indicators travel through the processing stages. -->
<g fill="#e0f2fe" opacity=".95" filter="url(#shadow)"><circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite" path="M195 201 L226 201"/></circle><circle r="4"><animateMotion dur="2.8s" begin=".45s" repeatCount="indefinite" path="M383 201 L414 201"/></circle><circle r="4"><animateMotion dur="2.8s" begin=".9s" repeatCount="indefinite" path="M571 201 L602 201"/></circle><circle r="4"><animateMotion dur="2.8s" begin="1.35s" repeatCount="indefinite" path="M759 201 L790 201"/></circle><circle r="4"><animateMotion dur="2.8s" begin="1.8s" repeatCount="indefinite" path="M947 201 L978 201"/></circle></g>
<g fill="none" stroke="#67e8f9" stroke-width="2" opacity=".55"><circle cx="120" cy="201" r="58"><animate attributeName="r" values="52;62;52" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;.08;.5" dur="3.6s" repeatCount="indefinite"/></circle><circle cx="1070" cy="201" r="58"><animate attributeName="r" values="52;62;52" dur="3.6s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;.08;.5" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></circle></g>
</svg>