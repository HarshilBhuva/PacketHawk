<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">PacketHawk investigation workflow</title><desc id="desc">An analyst selects a saved capture, PacketHawk validates and parses it, builds packet and flow context, evaluates detection rules, and returns findings with supporting evidence.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient><linearGradient id="a" x1="0" x2="1"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="b" x1="0" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient><linearGradient id="c" x1="0" x2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#84cc16"/></linearGradient></defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/><text x="52" y="54" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">FROM CAPTURE TO INVESTIGATION</text><text x="52" y="80" fill="#a5b4fc" font-family="Inter,Arial,sans-serif" font-size="14">A repeatable, evidence-first workflow for network defenders</text>
<g font-family="Inter,Arial,sans-serif"><rect x="52" y="132" width="190" height="132" rx="18" fill="#0c4a6e" stroke="#38bdf8"/><circle cx="82" cy="164" r="15" fill="#0ea5e9"/><text x="82" y="169" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">1</text><text x="72" y="205" fill="#f8fafc" font-size="17" font-weight="700">Select capture</text><text x="72" y="231" fill="#bae6fd" font-size="12">PCAP / PCAPNG file</text>
<rect x="286" y="132" width="190" height="132" rx="18" fill="#12304a" stroke="#22d3ee"/><circle cx="316" cy="164" r="15" fill="#0891b2"/><text x="316" y="169" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">2</text><text x="306" y="205" fill="#f8fafc" font-size="17" font-weight="700">Validate + parse</text><text x="306" y="231" fill="#a5f3fc" font-size="12">Lengths, links, protocols</text>
<rect x="520" y="132" width="190" height="132" rx="18" fill="#29214f" stroke="#a78bfa"/><circle cx="550" cy="164" r="15" fill="#7c3aed"/><text x="550" y="169" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">3</text><text x="540" y="205" fill="#f8fafc" font-size="17" font-weight="700">Build context</text><text x="540" y="231" fill="#ddd6fe" font-size="12">Packets + flow timeline</text>
<rect x="754" y="132" width="190" height="132" rx="18" fill="#3b1d4b" stroke="#e879f9"/><circle cx="784" cy="164" r="15" fill="#c026d3"/><text x="784" y="169" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">4</text><text x="774" y="205" fill="#f8fafc" font-size="17" font-weight="700">Evaluate rules</text><text x="774" y="231" fill="#f5d0fe" font-size="12">Indicators + thresholds</text>
<rect x="988" y="132" width="160" height="132" rx="18" fill="#123b32" stroke="#34d399"/><circle cx="1018" cy="164" r="15" fill="#059669"/><text x="1018" y="169" fill="#fff" font-size="13" text-anchor="middle" font-weight="700">5</text><text x="1008" y="205" fill="#f8fafc" font-size="17" font-weight="700">Review</text><text x="1008" y="231" fill="#bbf7d0" font-size="12">Evidence + report</text></g>
<g stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M244 198h34m-8-7 8 7-8 7"/><path d="M478 198h34m-8-7 8 7-8 7"/><path d="M712 198h34m-8-7 8 7-8 7"/><path d="M946 198h34m-8-7 8 7-8 7"/></g><text x="52" y="314" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="13">Current milestone: capture selection and packet parsing. Flow context and detection stages are on the roadmap.</text>
<!-- Animated hand-off markers reinforce the analyst's left-to-right workflow. -->
<g fill="#e0f2fe" opacity=".95"><circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M244 198 L278 198"/></circle><circle r="4"><animateMotion dur="2.4s" begin=".6s" repeatCount="indefinite" path="M478 198 L512 198"/></circle><circle r="4"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M712 198 L746 198"/></circle><circle r="4"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M946 198 L980 198"/></circle></g>
<g fill="none" stroke="#a5f3fc" stroke-width="2" opacity=".45"><circle cx="147" cy="198" r="72"><animate attributeName="r" values="66;78;66" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;.06;.45" dur="4s" repeatCount="indefinite"/></circle><circle cx="1068" cy="198" r="64"><animate attributeName="r" values="58;70;58" dur="4s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;.06;.45" dur="4s" begin="2s" repeatCount="indefinite"/></circle></g>
</svg>