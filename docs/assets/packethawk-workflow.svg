<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">PacketHawk analyst workflow</title><desc id="desc">A five-step analyst workflow: select a saved capture, validate and decode, build flow context, evaluate detection rules, and review evidence.</desc>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern><style>
:root{--bg:#f3f1e9;--panel:#faf9f4;--ink:#20211c;--muted:#626459;--line:rgba(32,33,28,.22);--grid:rgba(32,33,28,.06);--accent:#c78354}
@media(prefers-color-scheme:dark){:root{--bg:#11120f;--panel:#191a16;--ink:#f2f0e8;--muted:#a5a69b;--line:rgba(242,240,232,.22);--grid:rgba(242,240,232,.05);--accent:#e5ac82}}
text{font-family:Inter,system-ui,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.card{fill:var(--panel);stroke:var(--line)}.wire{stroke:var(--line);stroke-width:2;stroke-dasharray:5 8;animation:flow 5s linear infinite}.dot{fill:var(--accent);animation:blink 2s ease-in-out infinite}.dot:nth-of-type(2){animation-delay:.4s}.dot:nth-of-type(3){animation-delay:.8s}
@keyframes flow{to{stroke-dashoffset:-52}}@keyframes blink{50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.wire,.dot{animation:none}}
</style></defs>
<rect width="1200" height="340" rx="20" fill="var(--bg)"/><rect width="1200" height="340" rx="20" fill="url(#g)"/><rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="var(--line)"/>
<text x="40" y="48" font-size="13" font-weight="700" letter-spacing="2" class="muted">ANALYST WORKFLOW</text>
<path d="M140 158H1060" class="wire"/>
<g transform="translate(40 92)"><rect width="200" height="132" rx="14" class="card"/><circle cx="28" cy="28" r="14" fill="var(--accent)" fill-opacity=".2"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700">1</text><text x="20" y="70" font-size="19" font-weight="700">Select capture</text><text x="20" y="96" font-size="13" class="muted">Saved PCAP / PCAPNG</text></g>
<g transform="translate(275 92)"><rect width="200" height="132" rx="14" class="card"/><circle cx="28" cy="28" r="14" fill="var(--accent)" fill-opacity=".2"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700">2</text><text x="20" y="70" font-size="19" font-weight="700">Validate + decode</text><text x="20" y="96" font-size="13" class="muted">Bounds and protocols</text></g>
<g transform="translate(510 92)"><rect width="200" height="132" rx="14" class="card"/><circle cx="28" cy="28" r="14" fill="var(--accent)" fill-opacity=".2"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700">3</text><text x="20" y="70" font-size="19" font-weight="700">Build context</text><text x="20" y="96" font-size="13" class="muted">Flows and counters</text></g>
<g transform="translate(745 92)"><rect width="200" height="132" rx="14" class="card"/><circle cx="28" cy="28" r="14" fill="var(--accent)" fill-opacity=".2"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700">4</text><text x="20" y="70" font-size="19" font-weight="700">Evaluate rules</text><text x="20" y="96" font-size="13" class="muted">Scans · beacon · DNS</text></g>
<g transform="translate(980 92)"><rect width="180" height="132" rx="14" fill="var(--accent)" fill-opacity=".16" stroke="var(--accent)"/><circle cx="28" cy="28" r="14" fill="var(--accent)" fill-opacity=".3"/><text x="28" y="33" text-anchor="middle" font-size="13" font-weight="700">5</text><text x="20" y="70" font-size="19" font-weight="700">Review evidence</text><text x="20" y="96" font-size="13" class="muted">Validate the signal</text></g>
<circle cx="140" cy="158" r="4" class="dot"/><circle cx="375" cy="158" r="4" class="dot"/><circle cx="610" cy="158" r="4" class="dot"/>
<text x="40" y="282" font-size="13" class="muted">Findings are investigative leads — correlate with endpoint, identity, and application telemetry before escalation.</text>
</svg>