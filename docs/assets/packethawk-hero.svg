<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">PacketHawk — Offline network threat analysis</title>
<desc id="desc">A dark and light theme-aware hero card with a subtle graph-paper grid, warm amber accent, terminal command, and animated packet trace flowing through the PacketHawk mark.</desc>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5ac82" stop-opacity=".22"/><stop offset="1" stop-color="#e5ac82" stop-opacity="0"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    :root{--bg:#f3f1e9;--surface:#faf9f4;--ink:#20211c;--muted:#626459;--grid:rgba(32,33,28,.07);--line:rgba(32,33,28,.2);--accent:#c78354;--accentInk:#241b15}
    @media(prefers-color-scheme:dark){:root{--bg:#11120f;--surface:#191a16;--ink:#f2f0e8;--muted:#a5a69b;--grid:rgba(242,240,232,.055);--line:rgba(242,240,232,.2);--accent:#e5ac82;--accentInk:#241b15}}
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
    .muted{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .card{fill:var(--surface);stroke:var(--line)}.trace{stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:5 12;animation:dash 7s linear infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-170}}@keyframes pulse{50%{opacity:.45;transform:scale(.86)}}
    @media(prefers-reduced-motion:reduce){.trace{animation:none}.pulse{animation:none}}
  </style>
</defs>
<rect width="1200" height="430" rx="24" fill="var(--bg)"/>
<rect width="1200" height="430" rx="24" fill="url(#grid)"/>
<circle cx="1000" cy="80" r="180" fill="url(#glow)" filter="url(#soft)"/>
<rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="var(--line)"/>
<g transform="translate(64 58)">
  <rect width="52" height="52" rx="14" fill="#e5ac82"/>
  <path d="M12 28h10l6-12 7 24 6-12h5" fill="none" stroke="#241b15" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="23" font-size="15" font-weight="750" letter-spacing="2.5">PACKETHAWK</text>
  <text x="68" y="43" font-size="12" class="muted mono">NETWORK FORENSICS · RUST</text>
</g>
<g transform="translate(64 155)">
  <text font-size="54" font-weight="800" letter-spacing="-2.5">See the signal.</text>
  <text y="64" font-size="54" font-weight="800" letter-spacing="-2.5">Keep the evidence.</text>
  <text y="112" font-size="19" class="muted">Offline-first PCAP / PCAPNG threat analysis.</text>
  <text y="141" font-size="19" class="muted">Bounded streams. Explainable findings. Rust.</text>
  <rect y="178" width="500" height="54" rx="10" class="card"/>
  <circle cx="23" cy="27" r="5" fill="#3c735b"/>
  <text x="42" y="33" font-size="15" class="mono">packethawk capture detect traffic.pcap</text>
  <text y="270" font-size="12" class="muted mono">CAPTURE  →  DECODE  →  FLOW  →  DETECT  →  REPORT</text>
</g>
<g transform="translate(720 95)">
  <rect width="410" height="260" rx="18" class="card"/>
  <text x="26" y="36" font-size="11" font-weight="700" class="muted mono" letter-spacing="1.5">ANALYSIS TRACE / OFFLINE MODE</text>
  <path d="M48 83H356M48 132H356M48 181H356" stroke="var(--line)" stroke-width="1"/>
  <path d="M48 83H356M48 132H356M48 181H356" class="trace"/>
  <g fill="#e5ac82">
    <rect x="38" y="73" width="20" height="20" rx="5"/><rect x="147" y="122" width="20" height="20" rx="5"/><rect x="255" y="171" width="20" height="20" rx="5"/>
  </g>
  <g font-size="12" class="muted mono">
    <text x="26" y="111">PCAP</text><text x="126" y="160">FLOW</text><text x="236" y="209">ALERT</text>
  </g>
  <g transform="translate(300 56)">
    <circle cx="35" cy="35" r="25" fill="#3c735b" opacity=".12"/>
    <circle cx="35" cy="35" r="7" fill="#3c735b" class="pulse"/>
    <path d="M24 35l8 8 15-18" fill="none" stroke="#3c735b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="26" y="235" font-size="12" class="muted">No live capture · No packet injection · No cloud upload</text>
</g>
</svg>