<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" role="img" aria-labelledby="title desc">
<title id="title">PacketHawk — Offline network threat analysis</title>
<desc id="desc">A compact responsive PacketHawk hero with a warm amber identity, graph-paper grid, offline analysis command, and an animated evidence pipeline.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5ac82" stop-opacity=".2"/><stop offset="1" stop-color="#e5ac82" stop-opacity="0"/></linearGradient>
  <style>
    :root{--bg:#f3f1e9;--surface:#faf9f4;--ink:#20211c;--muted:#626459;--grid:rgba(32,33,28,.07);--line:rgba(32,33,28,.2);--accent:#c78354}
    @media(prefers-color-scheme:dark){:root{--bg:#11120f;--surface:#191a16;--ink:#f2f0e8;--muted:#a5a69b;--grid:rgba(242,240,232,.055);--line:rgba(242,240,232,.2);--accent:#e5ac82}}
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
    .muted{fill:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .card{fill:var(--surface);stroke:var(--line)}
    .trace{stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 10;animation:dash 6s linear infinite}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-150}}@keyframes pulse{50%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){.trace,.pulse{animation:none}}
  </style>
</defs>
<rect width="680" height="520" rx="22" fill="var(--bg)"/>
<rect width="680" height="520" rx="22" fill="url(#grid)"/>
<circle cx="590" cy="70" r="150" fill="url(#glow)"/>
<rect x=".75" y=".75" width="678.5" height="518.5" rx="21" fill="none" stroke="var(--line)"/>
<g transform="translate(42 38)">
  <rect width="48" height="48" rx="13" fill="#e5ac82"/>
  <path d="M10 26h9l6-11 7 22 6-11h5" fill="none" stroke="#241b15" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="21" font-size="14" font-weight="750" letter-spacing="2">PACKETHAWK</text>
  <text x="62" y="39" font-size="10.5" class="muted mono">NETWORK FORENSICS · RUST</text>
</g>
<g transform="translate(42 132)">
  <text font-size="43" font-weight="800" letter-spacing="-1.8">See the signal.</text>
  <text y="52" font-size="43" font-weight="800" letter-spacing="-1.8">Keep the evidence.</text>
  <text y="91" font-size="16" class="muted">Offline-first PCAP / PCAPNG threat analysis.</text>
  <text y="116" font-size="16" class="muted">Bounded streams. Explainable findings. Rust.</text>
  <rect y="145" width="596" height="54" rx="10" class="card"/>
  <circle cx="22" cy="172" r="5" fill="#4f9470"/>
  <text x="40" y="178" font-size="14" class="mono">packethawk capture detect traffic.pcap</text>
</g>
<g transform="translate(42 394)">
  <text font-size="10.5" font-weight="700" letter-spacing="1.5" class="muted mono">OFFLINE ANALYSIS PIPELINE</text>
  <path d="M20 45H575" class="trace" fill="none"/>
  <g fill="#e5ac82">
    <circle cx="20" cy="45" r="7"/><circle cx="158" cy="45" r="7"/><circle cx="296" cy="45" r="7"/><circle cx="434" cy="45" r="7"/><circle cx="575" cy="45" r="7"/>
  </g>
  <g font-size="11" class="muted mono" text-anchor="middle">
    <text x="20" y="69">CAPTURE</text><text x="158" y="69">DECODE</text><text x="296" y="69">FLOW</text><text x="434" y="69">DETECT</text><text x="575" y="69">REPORT</text>
  </g>
  <text x="20" y="104" font-size="11" class="muted">No live capture · No packet injection · No cloud upload</text>
  <circle cx="574" cy="101" r="5" fill="#4f9470" class="pulse"/>
</g>
</svg>