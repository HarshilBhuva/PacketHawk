[package]
name = "packethawk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline-first network threat analysis for PCAP and PCAPNG captures"
license = "MIT"
readme = "README.md"
keywords = ["pcap", "network-security", "threat-detection", "forensics"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.14"
criterion = "0.5.1"

[[bench]]
name = "ingestion"
harness = false

[[bench]]
name = "analysis"
harness = false
